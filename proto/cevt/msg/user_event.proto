syntax = "proto3";

package cevt.msg;

import "cevt/msg/tenant_meta.proto";
import "google/protobuf/timestamp.proto";

message UserEvent {
  string user_uuid = 30;
  int64 user_id = 31;

  TenantMeta tenant_meta = 50;

  // JSON-encoded mobile tracking context for server-side GA4 publishing.
  // Shape: {"ga_client_id": "...", "ga_session_id": "...", "ga_user_id": "...", "captured_at": "..."}.
  // Empty string when no mobile context is available (H2H, POS, backoffice paths).
  string tracking_context = 60;

  google.protobuf.Timestamp create_timestamp = 100;

  message LineItem {
    string item_id = 1;
    string item_name = 2;
    int32 quantity = 3;
    double price = 4;
    string item_category = 5;
  }

  message RegistrationSuccess {
    string email = 1;
    bool email_verified = 2;
    string first_name = 3;
    string last_name = 4;
    string phone = 5;
    string user_created_by = 6;
  }

  message EmailVerified {
    string email = 1;
  }

  message VoucherCreated {
    string voucher_code = 1;
    // string voucher_type = 2;
    // string status = 3;
    string promotion_id = 4;
    string expired_at = 5;
    // int64 generated_year = 6;
    // int64 redemption_limit = 7;
    string promo_name = 8;
  }

  message OrderCompleted {
    double amount = 1;
    string shopper_email = 2;
    string shopper_name = 3;
    string sku = 4;
    string order_number = 5;
    string created_at = 6;
    string payment_status = 7;
    string transaction_id = 8;
    string paid_at = 9;
    int64 transaction_count = 10;
  }

  message OrderPaid {
    double amount = 1;
    string shopper_email = 2;
    string shopper_name = 3;
    string items = 4;
    string order_number = 5;
    string created_at = 6;
    string payment_status = 7;
    string transaction_id = 8;
    string paid_at = 9;
    int64 transaction_count = 10;
    int32 point_used = 11;
    int32 qty = 12;
    repeated string sku = 13;
    repeated LineItem line_items = 14;
    string currency = 15;
  }

  message PaymentSuccess {
    double amount = 1;
    string shopper_email = 2;
    string shopper_name = 3;
    string sku = 4;
    string order_number = 5;
    string created_at = 6;
    string payment_status = 7;
    string transaction_id = 8;
    string paid_at = 9;
    string payment_method = 10;
    string card_brand = 11;
    string order_id = 12;
    double payment_amount = 13;
    string store_name = 14;
    repeated LineItem line_items = 15;
    string currency = 16;
  }

  message Refund {
    double amount = 1;
    string shopper_email = 2;
    string shopper_name = 3;
    string order_number = 5;
    string created_at = 6;
    string payment_status = 7;
    string transaction_id = 8;
    string refunded_at = 9;
    int64 transaction_count = 10;
    int32 qty = 12;
    repeated string sku = 13;
    repeated LineItem line_items = 14;
    string currency = 15;
  }

  message PaymentInitiated {
    string invoice_number = 1;
    string order_id = 2;
    double payment_amount = 3;
    string store_name = 4;
    double amount = 5;
    string payment_method = 6;
    string card_brand = 7;
    string order_number = 8;
    string transaction_id = 9;
    repeated LineItem line_items = 10;
    string currency = 11;
  }

  oneof body {
    RegistrationSuccess registration_success = 1;
    EmailVerified email_verified = 2;
    VoucherCreated voucher_created = 3;
    OrderCompleted order_completed = 4;
    PaymentSuccess payment_success = 5;
    PaymentInitiated payment_initiated = 6;
    OrderPaid order_paid = 7;
    Refund refund = 8;
  }
}
